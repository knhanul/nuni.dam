plugins { id 'com.android.application' }
android {
 namespace 'co.kr.nuni.dam'
 compileSdk 36
 defaultConfig {
  applicationId 'co.kr.nuni.dam'
  minSdk 23
  targetSdk 36
  versionCode 1
  versionName '0.1.0'
  javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] } }
 }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}
dependencies {
 implementation 'androidx.room:room-runtime:2.8.4'
 annotationProcessor 'androidx.room:room-compiler:2.8.4'
 // 2.12+ raises minSdk; review device support before upgrading.
 implementation 'androidx.work:work-runtime:2.11.0'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'androidx.palette:palette:1.0.0'
 implementation 'com.google.mlkit:face-detection:16.1.7'
 implementation 'org.nanohttpd:nanohttpd:2.3.1'
 implementation 'com.google.zxing:core:3.5.3'
 testImplementation 'junit:junit:4.13.2'
}

