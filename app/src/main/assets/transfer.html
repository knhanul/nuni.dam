<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>누니담 · 사진 보내기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#24332b;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}main{max-width:720px;margin:auto;padding:30px 20px 60px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.12em}.eyebrow{font-size:11px;letter-spacing:.18em;color:#626d65}h1{font-size:30px;letter-spacing:-.04em;margin:28px 0 8px}h2{font-size:19px;margin:0 0 12px}p,small{color:#626d65}p{font-size:14px}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;border:1px solid #cdd4c9}.status{background:#e8ede5;border-radius:12px;padding:14px 18px;font-size:14px;margin-top:22px}.error{background:#f6e4dc;color:#7d3c28}button,.file-button{border:0;border-radius:12px;background:#365b46;color:white;font:inherit;font-size:15px;padding:13px 20px;cursor:pointer;display:inline-block;text-align:center}button.secondary{background:#e8ede5;color:#365b46}button:disabled{opacity:.45}.wide{width:100%}.upload{padding:28px 18px;text-align:center;border:1px dashed #cdd4c9;border-radius:16px;background:#fbfcf8}input[type=file]{display:none}input,select,textarea{width:100%;border:1px solid #cdd4c9;border-radius:10px;font:inherit;color:inherit;background:white;padding:11px;margin:7px 0 16px}textarea{min-height:90px;resize:vertical}progress{width:100%;height:10px;border-radius:5px;accent-color:#365b46;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.photo{min-width:0;position:relative}.photo button{padding:0;border-radius:12px;width:100%;background:#e8ede5;overflow:hidden;aspect-ratio:1;display:block}.photo img{width:100%;height:100%;object-fit:cover}.caption{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{position:absolute;right:8px;top:5px;color:white;text-shadow:0 1px 5px #000}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}.toolbar h2{margin:0}.toolbar button{padding:8px 12px;font-size:12px}details summary{font-size:19px;font-weight:600;cursor:pointer}details[open] summary{margin-bottom:18px}.hidden{display:none!important}.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px}.pagination button{padding:7px 14px}.footer{text-align:center;font-size:12px;color:#626d65;margin-top:30px}dialog{border:0;border-radius:20px;max-width:92vw;width:420px;padding:25px;color:#24332b}dialog::backdrop{background:#18221da8}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.danger{background:#f7e6e0!important;color:#993f29!important}#progressWrap{margin-top:12px}#progressText{white-space:pre-line;font-size:13px;margin:6px 0;line-height:1.4}#currentFile{font-weight:600;font-size:14px;margin-bottom:4px}#fileList{font-size:12px;max-height:160px;overflow:auto;margin-top:8px;padding:8px;background:#fbfcf8;border-radius:8px;border:1px solid #e8ede5}#fileList div{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ok{color:#365b46}.fail{color:#a64932}#usage{font-size:12px;margin-bottom:15px}@media(max-width:370px){main{padding:20px 12px}.card{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><div class="brand">nuni dam</div><div class="eyebrow">A LITTLE GALLERY OF OUR DAYS</div><h1>좋아하는 순간을 더해요.</h1><p>스마트폰의 사진을 누니담 액자에 담아보세요.</p><div id="status" class="status" role="status" aria-live="polite">태블릿에서 연결을 승인해 주세요.</div>
<div id="content" class="hidden"><section class="card"><h2>새로운 추억 담기</h2><div class="upload"><div style="font-size:36px">＋</div><p>여러 장을 한 번에 선택할 수 있어요.</p><label class="file-button" for="files">사진 선택하기</label><input id="files" type="file" accept="image/*" multiple><p style="font-size:12px">한 장 최대 40 MB · 기기에 맞게 최적화하여 저장</p></div>
<div id="progressWrap" class="hidden">
  <div id="currentFile"></div>
  <progress id="progress" max="100" value="0"></progress>
  <div id="progressText" aria-live="polite"></div>
  <div id="fileList"></div>
</div>
<button id="retry" class="secondary hidden">실패한 사진만 다시 보내기</button></section>
<section class="card"><div class="toolbar"><h2>액자에 담긴 사진</h2><button id="refresh" class="secondary">새로고침</button></div><div id="usage"></div><div id="photos" class="grid"></div><p id="empty" class="hidden">첫 번째 사진을 담아보세요.</p><div class="pagination"><button id="prev" class="secondary">이전</button><small id="page"></small><button id="next" class="secondary">다음</button></div><small>사진을 눌러 문구·즐겨찾기를 바꿀 수 있습니다.</small></section>
<details class="card"><summary>액자 분위기 바꾸기</summary><form id="settings"><label for="mode">화면 구성</label><select id="mode"><option value="PHOTO">사진 액자</option><option value="MAGAZINE">매거진</option><option value="BOARD">생활 보드</option></select><label for="theme">색감</label><select id="theme"><option value="MILK">밀크</option><option value="INK">잉크</option><option value="SAGE">세이지</option></select><label for="quoteKind">표시할 명언 · 시</label><select id="quoteKind"><option value="ALL">명언과 시 모두</option><option value="QUOTE">명언 · 짧은 문구만</option><option value="POEM">시(詩)만</option><option value="NONE">표시 안 함</option></select><label for="quoteCycle">명언 · 시 변경 주기</label><select id="quoteCycle"><option value="PHOTO">사진이 바뀔 때마다</option><option value="MINUTES_15">15분마다</option><option value="HOUR">1시간마다</option><option value="DAY">하루에 한 번</option></select><label for="seconds">사진 전환 간격 · 초</label><input id="seconds" type="number" min="10" max="3600" required><label for="brightness">낮 밝기 · %</label><input id="brightness" type="number" min="10" max="100" required><label for="phrase">고정 한마디 (비워두면 명언·시 모음 자동 표시)</label><textarea id="phrase" maxlength="400"></textarea><button type="submit" class="wide">분위기 저장하기</button></form></details></div>
<div class="footer">같은 네트워크 안에서 직접 연결합니다.<br>전송을 마치면 태블릿에서 이 화면을 닫아주세요.</div>
<dialog id="edit"><h2>이 순간의 기록</h2><p id="editName"></p><textarea id="editNote" maxlength="400"></textarea><div class="actions"><button id="saveNote">기록 저장</button><button id="favourite" class="secondary">즐겨찾기</button></div><div class="actions"><button id="trash" class="danger">휴지통으로</button><button id="closeEdit" class="secondary">닫기</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
let token=location.hash.slice(1),photos=[],page=0,failed=[],busy=false,selected=null,urls=[],renderVersion=0,pairAttempts=0;
history.replaceState(null,'',location.pathname);
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...options.headers},cache:'no-store'});const b=await r.json();if(!r.ok)throw Error(b.error||'요청을 완료하지 못했습니다.');return b;}
const post=(path,b)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function pair(){if(!/^[a-f0-9]{48}$/.test(token)){status('태블릿의 QR 코드를 스캔해 주세요.',true);return;}try{const s=await api('/api/status');pairAttempts=0;if(s.approved){status('연결되었습니다. 사진을 담아보세요.');$('content').classList.remove('hidden');await Promise.all([loadPhotos(),loadSettings()]);}else setTimeout(pair,1500);}catch(e){pairAttempts++;status(e.message+' (재시도 중…)',true);if(pairAttempts<20)setTimeout(pair,2000+pairAttempts*500);else status(e.message,true);}}
async function loadPhotos(){const r=await api('/api/photos');photos=r.photos;page=Math.min(page,Math.max(0,Math.ceil(photos.length/24)-1));$('usage').textContent=photos.length+'장 · '+(r.used/1048576).toFixed(1)+' / '+Math.round(r.quota/1048576)+' MB';render();}
function render(){const version=++renderVersion;urls.forEach(URL.revokeObjectURL);urls=[];$('photos').replaceChildren();$('empty').classList.toggle('hidden',photos.length>0);const queue=[];photos.slice(page*24,page*24+24).forEach(p=>{const item=document.createElement('div');item.className='photo';const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',p.note||p.name);const img=document.createElement('img');img.alt=p.note||p.name;button.appendChild(img);button.onclick=()=>edit(p);item.appendChild(button);if(p.favourite){const star=document.createElement('span');star.className='star';star.textContent='★';item.appendChild(star);}const cap=document.createElement('div');cap.className='caption';cap.textContent=p.note||p.name;item.appendChild(cap);$('photos').appendChild(item);queue.push(async()=>{try{const r=await fetch('/api/image?id='+encodeURIComponent(p.id),{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error();const blob=await r.blob();if(!item.isConnected||version!==renderVersion)return;const url=URL.createObjectURL(blob);urls.push(url);img.src=url;}catch{img.alt='미리보기를 불러오지 못했어요';}});});async function consume(){while(queue.length&&version===renderVersion)await queue.shift()();}consume();consume();$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(photos.length/24));$('prev').disabled=page===0;$('next').disabled=(page+1)*24>=photos.length;}
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('refresh').onclick=()=>loadPhotos().catch(e=>status(e.message,true));

function updateFileStatus(listEl, index, name, state, detail){
  let row=listEl.children[index];
  if(!row){row=document.createElement('div');listEl.appendChild(row);}
  const icon=state==='ok'?'✓ ':state==='fail'?'✗ ':state==='uploading'?'→ ':'· ';
  row.className=state==='ok'?'ok':state==='fail'?'fail':'';
  row.textContent=icon+(index+1)+'. '+name+(detail?'  '+detail:'');
}

function upload(file,i,total,listEl){return new Promise((resolve,reject)=>{if(file.size>40*1024*1024){reject(Error('40 MB를 초과한 파일입니다.'));return;}const x=new XMLHttpRequest();x.open('POST','/api/upload?name='+encodeURIComponent(file.name));x.setRequestHeader('Authorization','Bearer '+token);x.setRequestHeader('Content-Type',file.type||'application/octet-stream');x.timeout=300000;
x.upload.onprogress=e=>{
  const pct=e.lengthComputable?Math.round(e.loaded/e.total*100):0;
  const overall=Math.round(((i + (e.lengthComputable?e.loaded/e.total:0))/total)*100);
  $('progress').value=overall;
  $('currentFile').textContent=`${i+1} / ${total} · ${file.name}`;
  $('progressText').textContent=`현재 파일 ${pct}%  (${fmtSize(e.loaded)} / ${fmtSize(e.total||file.size)})\n전첰 진행 ${overall}%`;
  updateFileStatus(listEl,i,file.name,'uploading',pct+'%');
};
x.onload=()=>{try{const b=JSON.parse(x.responseText);if(x.status>=200&&x.status<300){updateFileStatus(listEl,i,file.name,'ok','완료');resolve(b);}else{updateFileStatus(listEl,i,file.name,'fail',b.error||'실패');reject(Error(b.error||'전송 실패'));}}catch{updateFileStatus(listEl,i,file.name,'fail','응답 오류');reject(Error('응답을 읽지 못했습니다.'));}};
x.onerror=()=>{updateFileStatus(listEl,i,file.name,'fail','연결 끊김');reject(Error('연결이 끊기었습니다. 태블릿 화면이 열려 있는지와 Wi-Fi를 확인하세요.'));};
x.ontimeout=()=>{updateFileStatus(listEl,i,file.name,'fail','시간 초과');reject(Error('전송 시간이 초과되었습니다. 사진을 줄이거나 Wi-Fi를 확인해 주세요.'));};
x.send(file);});}

async function send(files){if(busy||!files.length)return;busy=true;failed=[];$('files').disabled=true;$('retry').classList.add('hidden');
const wrap=$('progressWrap');wrap.classList.remove('hidden');$('progress').value=0;$('currentFile').textContent='';$('progressText').textContent='';
const listEl=$('fileList');listEl.innerHTML='';
files.forEach((f,i)=>updateFileStatus(listEl,i,f.name,'pending',''));
let ok=0,last='';
for(let i=0;i<files.length;i++){try{await upload(files[i],i,files.length,listEl);ok++;await new Promise(r=>setTimeout(r,250));}catch(e){failed.push(files[i]);last=e.message;}}
$('progress').value=100;
$('currentFile').textContent='전송 완료';
$('progressText').textContent=`${ok}장 성공`+(failed.length?` · ${failed.length}장 실패\n${last}`:' · 모두 성공했습니다.');
$('retry').classList.toggle('hidden',failed.length===0);
$('files').disabled=false;$('files').value='';busy=false;
try{await loadPhotos();}catch(e){status(e.message,true);}}

$('files').onchange=e=>send(Array.from(e.target.files));
$('retry').onclick=()=>send([...failed]);
function edit(p){selected=p;$('editName').textContent=p.name;$('editNote').value=p.note;$('favourite').textContent=p.favourite?'★ 즐겨찾기 해제':'☆ 즐겨찾기';typeof $('edit').showModal==='function'?$('edit').showModal():$('edit').setAttribute('open','');
}
function closeEdit(){typeof $('edit').close==='function'?$('edit').close():$('edit').removeAttribute('open');}
$('closeEdit').onclick=closeEdit;
$('saveNote').onclick=async()=>{try{await post('/api/photo',{id:selected.id,action:'note',note:$('editNote').value});closeEdit();await loadPhotos();}catch(e){status(e.message,true);}};
$('favourite').onclick=async()=>{try{await post('/api/photo',{id:selected.id,action:'favourite',value:!selected.favourite});closeEdit();await loadPhotos();}catch(e){status(e.message,true);}};
$('trash').onclick=async()=>{if(!confirm('누니담 휴지통으로 옮길까요? 태블릿에서 복원할 수 있습니다.'))return;try{await post('/api/photo',{id:selected.id,action:'trash'});closeEdit();await loadPhotos();}catch(e){status(e.message,true);}};
async function loadSettings(){const s=await api('/api/settings');for(const k of ['mode','theme','seconds','brightness','phrase','quoteKind','quoteCycle'])if(s[k]!==undefined)$(k).value=s[k];}
$('settings').onsubmit=async e=>{e.preventDefault();try{await post('/api/settings',{mode:$('mode').value,theme:$('theme').value,seconds:Number($('seconds').value),brightness:Number($('brightness').value),phrase:$('phrase').value,quoteKind:$('quoteKind').value,quoteCycle:$('quoteCycle').value});status('분위기를 저장했습니다. 태블릿에서 액자를 시작하면 적용됩니다.');}catch(e){status(e.message,true);}};
pair();
</script></main></body></html>
